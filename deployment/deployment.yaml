apiVersion: v1
kind: Namespace
metadata:
  name: local-podcasts
---
# This is an example PVC, it will likely be different in your environment
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: data-volume
  namespace: local-podcasts
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: auto-nfs-client
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-podcasts
  namespace: local-podcasts
  labels:
    app: local-podcasts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-podcasts
  template:
    metadata:
      labels:
        app: local-podcasts
        name: local-podcasts
    spec:
      containers:
        - name: local-podcasts
          # Check packages in github for latest version
          image: ghcr.io/nathanamorin/local-podcasts:<latest release tag here>
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: data-volume
---
# Worker pods perform episode downloads and audio fingerprinting, claimed
# over HTTP from the main app's internal job API. They need no database
# access and no shared storage/PVC mount at all - audio bytes move entirely
# over HTTP (download -> upload to the main app; fingerprint -> re-fetch
# from the main app's public /stream endpoint), so this Deployment can be
# scaled to any replica count, on any node, independent of storage topology.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-podcasts-worker
  namespace: local-podcasts
  labels:
    app: local-podcasts-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: local-podcasts-worker
  template:
    metadata:
      labels:
        app: local-podcasts-worker
        name: local-podcasts-worker
    spec:
      containers:
        - name: local-podcasts-worker
          image: ghcr.io/nathanamorin/local-podcasts:<latest release tag here>
          command: ["/app/local-podcasts-worker"]
          env:
            - name: LOCAL_PODCASTS_WORKER_INTERNAL_API_URL
              value: http://local-podcasts-internal.local-podcasts.svc.cluster.local:8081
            - name: LOCAL_PODCASTS_WORKER_PUBLIC_API_URL
              value: http://local-podcasts.local-podcasts.svc.cluster.local:8080
---
apiVersion: v1
kind: Service
metadata:
  name: local-podcasts
  namespace: local-podcasts
  # The ServiceMonitor's spec.selector.matchLabels matches against this
  # Service's metadata.labels (not spec.selector) - without this label the
  # ServiceMonitor is discovered but the scrape target is relabel-dropped,
  # so the metric never reaches Prometheus/Mimir.
  labels:
    app: local-podcasts
spec:
  selector:
    app: local-podcasts
  ports:
    - port: 8080
      targetPort: 8080
      name: local-podcasts
---
# Internal job-claim API, consumed only by local-podcasts-worker pods - do
# not expose this Service via an Ingress.
apiVersion: v1
kind: Service
metadata:
  name: local-podcasts-internal
  namespace: local-podcasts
  labels:
    app: local-podcasts
spec:
  selector:
    app: local-podcasts
  ports:
    - port: 8081
      targetPort: 8081
      name: internal
---
# Scraped by the cluster's Grafana Alloy agent (prometheus.operator.servicemonitors),
# which forwards to Mimir. Exposes local_podcasts_episode_downloads_total and
# Go/process runtime metrics at /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: local-podcasts
  namespace: local-podcasts
  labels:
    app: local-podcasts
spec:
  selector:
    matchLabels:
      app: local-podcasts
  endpoints:
    - port: local-podcasts
      path: /metrics
      interval: 60s
---
# Example ingress below, but will likely be different depending on your environment
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: local-podcasts
  namespace: local-podcasts
spec:
  ingressClassName: nginx
  rules:
    - host: "local-podcasts.nathanmorin.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: local-podcasts
                port:
                  number: 8080